<svg style="position: absolute; width: 0; height: 0; pointer-events: none;">
  <filter id="fog-turbulence">
    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="4" result="noise">
      <animate attributeName="baseFrequency" dur="30s" values="0.01 0.01; 0.02 0.03; 0.01 0.01" repeatCount="indefinite" />
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="50" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

<div class="objective-selection-root">
  <div class="smoke-layer"></div>
  <div class="particles-layer"></div>

  <div class="selection-container">
    <h2 class="selection-title">ОБЕРІТЬ ТАЄМНУ ЦІЛЬ ДЛЯ КЛАНУ {{ currentClan }}</h2>
    <p class="selection-subtitle">Ця ціль прихована від інших гравців. Виконайте її в кінці партії, щоб отримати бонусні очки честі.</p>
    
    <div class="objectives-cards-grid">
      <div class="clan-card-objective" 
           *ngFor="let obj of offeredObjectives" 
           (click)="selectObjective(obj)"
           [style.backgroundImage]="'url(\'assets/images/icons/secret-objective-selection.png\')'">
        <div class="card-overlay"></div>
        
        <div class="card-content-wrapper">
          <div class="obj-header">
            <span class="obj-reward">🏅 +{{ obj.rewardHonor }} ОЧЕЙ</span>
          </div>
          <div class="card-body-text">
            <h3 class="obj-name">{{ obj.title }}</h3>
            <p class="obj-desc">{{ obj.description }}</p>
          </div>
          <div class="obj-select-btn">ВИБРАТИ ЦЮ ЦІЛЬ</div>
        </div>
      </div>
    </div>
  </div>
</div>
